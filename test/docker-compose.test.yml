services:
  app-test:
    build:
      context: ..
      dockerfile: Dockerfile
    image: signalforge-test:latest
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      - LLM_MOCK=true
      - SERVER_ADDRESS=0.0.0.0
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/test-db/signalforge-e2e.db
    volumes:
      - e2e-data:/app/test-db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  playwright:
    image: mcr.microsoft.com/playwright:v1.45.0-jammy
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      app-test:
        condition: service_healthy
    environment:
      - BASE_URL=http://app-test:8000
    command: ["sh", "-c", "npm ci && npm test"]

volumes:
  e2e-data:
