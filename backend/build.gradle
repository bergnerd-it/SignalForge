plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.bergnerd.signalforge'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def getGitCommit() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return "UNKNOWN"
    }
}

def isGitDirty() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status', '--porcelain'
            standardOutput = stdout
        }
        return !stdout.toString().trim().isEmpty()
    } catch (Exception ignored) {
        return false
    }
}

def getCodeFingerprint() {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    def sources = fileTree('src/main/java').files + fileTree('src/main/resources/db/migration').files + [file('build.gradle')]
    sources.sort { it.path }.each { source ->
        digest.update(project.relativePath(source).getBytes('UTF-8'))
        digest.update([0] as byte[])
        digest.update(source.bytes)
    }
    return digest.digest().encodeHex().toString()
}

processResources {
    inputs.files(fileTree('src/main/java'), fileTree('src/main/resources/db/migration'), file('build.gradle'))
    filesMatching('signalforge-build.properties') {
        expand(
            'buildVersion': project.version.toString(),
            'gitCommit': getGitCommit(),
            'gitDirty': isGitDirty().toString(),
            'codeFingerprint': getCodeFingerprint()
        )
    }
}

bootJar {
    archiveBaseName = 'signalforge-backend'
    archiveVersion = '1.0.0-SNAPSHOT'
}

tasks.named('test') {
    useJUnitPlatform()
}
