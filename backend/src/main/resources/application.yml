server:
  port: 8000
  error:
    include-message: always

spring:
  application:
    name: finally-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:../application-local.yml
      - optional:classpath:application-local.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:../db/finally.db}
    driver-class-name: org.sqlite.JDBC

finally:
  llm:
    provider: ${LLM_PROVIDER:openai}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    mock: ${LLM_MOCK:false}
  massive:
    api-key: ${MASSIVE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info